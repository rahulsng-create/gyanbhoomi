<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">The Human Immune System — illustrated cover</title><desc id="desc">Medical illustration of a human figure showing lymphatic vessels, thymus, spleen, bone marrow and lymph nodes, with immune cells and antibodies.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#062e2b"/><stop offset=".55" stop-color="#0c5148"/><stop offset="1" stop-color="#031f20"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#1c9b86" stop-opacity=".7"/><stop offset="1" stop-color="#0b3e39" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffe7a0"/><stop offset="1" stop-color="#d7a83f"/></linearGradient>
 <linearGradient id="body" x2="1" y2="1"><stop stop-color="#b8e9dc" stop-opacity=".85"/><stop offset="1" stop-color="#4ca99a" stop-opacity=".24"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1600" height="820" rx="34" fill="url(#bg)"/><circle cx="1110" cy="390" r="500" fill="url(#glow)"/>
<g opacity=".23" fill="#7dd6c1"><circle cx="890" cy="100" r="7"/><circle cx="1450" cy="140" r="5"/><circle cx="1040" cy="720" r="8"/><circle cx="720" cy="590" r="5"/><circle cx="1500" cy="640" r="6"/></g>
<g font-family="Arial, sans-serif">
