 <text x="78" y="245" fill="#fff4d1" font-size="82" font-weight="800">THE HUMAN</text>
 <text x="78" y="340" fill="url(#gold)" font-size="94" font-weight="800">IMMUNE SYSTEM</text>
 <text x="82" y="405" fill="#e6f4ed" font-size="35">How your body detects, fights</text><text x="82" y="452" fill="#e6f4ed" font-size="35">and remembers diseases</text>
 <path d="M82 500H650" stroke="#d6b25d" stroke-width="3" opacity=".8"/>
 <text x="82" y="555" fill="#c7e2d8" font-size="24">ORGANS  •  CELLS  •  ANTIBODIES  •  IMMUNE MEMORY</text>
</g>
