<path d="M110 90Q87 82 63 97V109Q86 95 107 105Z" fill="url(#ivory)" stroke="url(#gold)" stroke-width="1.5"/>
<path d="M63 97v17" stroke="#bb8427" stroke-width="1.8"/>
<path d="M24 94q16-5 31 4M102 94q-16-5-31 4" fill="none" stroke="#fff7d8" stroke-width="1.4" opacity=".95"/><path d="M20 91Q39 84 60 97" fill="none" stroke="#fff" stroke-width="1.5" opacity=".65"/>
</svg>