<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="GyanBhoomi Gyan Globe">
<defs>
 <radialGradient id="bg" cx="34%" cy="20%" r="95%"><stop stop-color="#087b5b"/><stop offset=".55" stop-color="#064333"/><stop offset="1" stop-color="#021f1c"/></radialGradient>
 <radialGradient id="earth" cx="30%" cy="18%" r="90%"><stop stop-color="#48e0ae"/><stop offset=".48" stop-color="#087d69"/><stop offset="1" stop-color="#022f2d"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff5bd"/><stop offset=".32" stop-color="#ffdf72"/><stop offset=".68" stop-color="#e9a91f"/><stop offset="1" stop-color="#9f6410"/></linearGradient>
 <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef2"/><stop offset="1" stop-color="#e7d9b5"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feOffset dy="2"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="globeClip"><circle cx="64" cy="49" r="39"/></clipPath>

 <filter id="goldGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.1" result="blur"/><feColorMatrix in="blur" type="matrix" values="1 0 0 0 .9 0 1 0 0 .55 0 0 1 0 .05 0 0 0 1 0" result="warm"/><feMerge><feMergeNode in="warm"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="tealGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".35" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <linearGradient id="goldSheen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffde1"/><stop offset=".2" stop-color="#fff0a0"/><stop offset=".48" stop-color="#f5c84e"/><stop offset=".7" stop-color="#e39a16"/><stop offset="1" stop-color="#fff0a0"/></linearGradient>
</defs>
<rect x="3" y="3" width="122" height="122" rx="25" fill="url(#bg)" stroke="url(#goldSheen)" stroke-width="3" filter="url(#goldGlow)"/>
<rect x="7" y="7" width="114" height="114" rx="21" fill="none" stroke="#fff4c2" stroke-opacity=".55" stroke-width=".8"/><path d="M13 27Q20 9 43 8H85" fill="none" stroke="#fff" stroke-width="1.5" opacity=".42"/>
<circle cx="64" cy="49" r="40.5" fill="#022b27" stroke="url(#goldSheen)" stroke-width="2.8" filter="url(#goldGlow)"/>
<circle cx="64" cy="49" r="38" fill="url(#earth)" filter="url(#tealGlow)"/>
<g clip-path="url(#globeClip)">
 <g fill="none" stroke="#a8f5dc" stroke-width="1" opacity=".55">
  <path d="M25 49h78M64 10v78M30 29q34 19 0 40M98 29q-34 19 0 40"/>
  <ellipse cx="64" cy="49" rx="17" ry="39"/><ellipse cx="64" cy="49" rx="30" ry="39"/>
 </g>
 <path d="M29 37l7-10 9-3 8 6-2 7-8 5-2 10-8 1-5-8zm23-19l8-8 9 3 2 8-7 5-8-3zm19 7l9-6 9 5-2 9-9 2-5-5zm-15 28l9-6 8 4 2 10-7 8-9-4-4-7zm23 8l10-6 10 4 2 8-8 7-10-2z" fill="#b7ef8d" stroke="#d9ffd0" stroke-width=".6"/>
 <path d="M27 24q30-22 66-2" fill="none" stroke="#e6ffda" stroke-width="2" opacity=".45"/>
</g>
<!-- Large signature G -->
<text x="64" y="79" text-anchor="middle" font-family="Georgia,serif" font-size="65" font-weight="bold" fill="url(#ivory)" stroke="#b98628" stroke-width="1.3" paint-order="stroke fill" filter="url(#goldGlow)">G</text>
<!-- Golden orbit crossing the globe and G -->
<path d="M14 66C34 77 82 66 112 35" fill="none" stroke="#8b5a10" stroke-width="8" stroke-linecap="round" opacity=".7"/>
<path d="M14 64C36 75 83 63 112 33" fill="none" stroke="url(#goldSheen)" stroke-width="5.8" stroke-linecap="round" filter="url(#goldGlow)"/>
<path d="M19 63C44 70 82 57 105 39" fill="none" stroke="#fff2b3" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
