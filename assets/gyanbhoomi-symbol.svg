<path d="M108 20l3.2 9.2 9.2 3.2-9.2 3.2-3.2 9.2-3.2-9.2-9.2-3.2 9.2-3.2z" fill="url(#goldSheen)" stroke="#fffbe0" stroke-width="1.2" filter="url(#goldGlow)"/>
