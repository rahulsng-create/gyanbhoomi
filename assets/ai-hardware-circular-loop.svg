<g font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle">
 <g><rect x="45" y="135" width="190" height="78" rx="15" fill="#174e43" stroke="#d4b36a" stroke-width="2"/><text x="140" y="167" fill="#f1d99e" font-size="20">01 · COMPUTE</text><text x="140" y="191" fill="#e4f2e9" font-size="14">Servers in use</text></g>
 <g><rect x="665" y="135" width="190" height="78" rx="15" fill="#174e43" stroke="#d4b36a" stroke-width="2"/><text x="760" y="167" fill="#f1d99e" font-size="20">02 · RETIRE</text><text x="760" y="191" fill="#e4f2e9" font-size="14">Secure decommission</text></g>
 <g><rect x="665" y="290" width="190" height="78" rx="15" fill="#174e43" stroke="#d4b36a" stroke-width="2"/><text x="760" y="322" fill="#f1d99e" font-size="20">03 · RECOVER</text><text x="760" y="346" fill="#e4f2e9" font-size="14">Safe sorting &amp; repair</text></g>
 <g><rect x="45" y="290" width="190" height="78" rx="15" fill="#174e43" stroke="#d4b36a" stroke-width="2"/><text x="140" y="322" fill="#f1d99e" font-size="20">04 · REUSE</text><text x="140" y="346" fill="#e4f2e9" font-size="14">Materials return</text></g>
</g>
