<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
<title id="t">The circular hardware loop</title><desc id="d">A simple animated illustration showing compute, hardware retirement, safe recovery and material reintegration.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#062923"/><stop offset="1" stop-color="#0d5042"/></linearGradient><linearGradient id="g"><stop stop-color="#ffe8a6"/><stop offset="1" stop-color="#c8943c"/></linearGradient></defs>
<rect width="900" height="430" rx="28" fill="url(#bg)"/><rect x="14" y="14" width="872" height="402" rx="22" fill="none" stroke="url(#g)" stroke-width="3"/>
<text x="48" y="62" fill="#f1d99e" font-family="Arial,sans-serif" font-size="20" letter-spacing="3">GYANBHOOMI  •  CIRCULAR HARDWARE LOOP</text>
<circle cx="450" cy="220" r="135" fill="none" stroke="#d4b36a" stroke-opacity=".25" stroke-width="18"/>
<circle cx="450" cy="220" r="135" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="180 670">
 <animateTransform attributeName="transform" type="rotate" from="0 450 220" to="360 450 220" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="450" cy="220" r="95" fill="#0a3b35" stroke="#58c9a8" stroke-width="3"/>
<g fill="#e7d091" font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle">
 <text x="450" y="207" font-size="38">AI</text><text x="450" y="242" font-size="19">HARDWARE</text><text x="450" y="268" font-size="19">LIFE CYCLE</text>
