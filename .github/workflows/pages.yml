name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static article pages
        id: build
        continue-on-error: true
        run: npm run build

      - name: Find last successful Pages build
        id: last-good
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?status=success&per_page=20" --jq '[.workflow_runs[] | select(.head_branch == "main")] | .[0].id')"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No previous successful Pages run is available; refusing to deploy an incomplete build."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download last successful website artifact
        if: steps.build.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.last-good.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ./_last_good

      - name: Restore last successful website
        if: steps.build.outcome == 'failure'
        run: |
          set -euo pipefail
          test -s ./_last_good/artifact.tar
          rm -rf ./_site
          mkdir -p ./_site
          tar -xf ./_last_good/artifact.tar -C ./_site
          test -n "$(find ./_site -type f -print -quit)"
          echo "Restored the complete last successful website. No partial build will be deployed."

      - name: Notify IndexNow about new and changed public pages
        if: steps.build.outcome == 'success'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/submit-indexnow.mjs

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    # Builds may run in parallel; serialize only the production Pages deployment.
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# If Supabase is unavailable, only a complete last-successful Pages artifact may be deployed.
